name: grw_laser
description: "GRW Laser Robot - Saga"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  after_layout: ^1.2.0
  another_flushbar: ^1.12.29
  audioplayers: ^6.8.1
  auto_size_text: ^3.0.0
  device_info_plus: ^13.2.0
  dio: ^5.4.3+1
  encrypt: ^5.0.3
  flutter_joystick: ^0.0.4
  flutter_responsive_framework: ^0.0.2
  flutter_svg: ^2.0.16
  # Local 4.2.5 copy with iOS Swift Package Manager support.
  flutter_tts:
    path: packages/flutter_tts
  get: ^4.6.6
  hex: ^0.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.1
  intl: ^0.20.2
  material_symbols_icons: ^4.2744.0
  package_info_plus: ^10.2.1
  path: ^1.9.0
  path_provider: ^2.1.5
  percent_indicator: ^4.2.3
  provider: ^6.1.2
  responsive_framework: ^1.4.0
  scoped_model: ^2.0.0
  syncfusion_flutter_gauges: ^32.1.25
  syncfusion_flutter_sliders: ^32.1.25
  tcp_socket_connection: ^0.3.1
  unicons: ^2.1.2
  url_launcher: ^6.3.0
  url_launcher_ios: ^6.3.1
  vibration: ^3.1.5
  wakelock_plus: ^1.8.0
  volume_controller: ^3.7.0
  webview_flutter: ^4.14.1
  collection: ^1.19.1
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  # Local 0.5.2+1 copy using only built-in Kotlin (see LOCAL_CHANGES.md).
  android_id:
    path: packages/android_id
  popover: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/grw-icon.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - images/
    - images/laser/
  fonts:
    - family: Raleway
      fonts:
        - asset: fonts/ralewayregular.ttf
    - family: Oswald
      fonts:
        - asset: fonts/Oswald-Regular.ttf
    - family: RalewayBold
      fonts:
        - asset: fonts/ralewayextrabold.ttf
          weight: 900
